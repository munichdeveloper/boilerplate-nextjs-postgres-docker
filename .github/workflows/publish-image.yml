# No push/tag/PR trigger: an operator explicitly authorizes each publication.
name: Publish approved image
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing approved release tag (vX.Y.Z)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    environment: image-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.version }}
          provenance: true
          sbom: true
